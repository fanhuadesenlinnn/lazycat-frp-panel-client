name: Check Lazycat credentials

# 仅手动触发：检查 Secrets 里的懒猫账号能不能登录，并把凭据的“结构”
# （长度、字符类别、首尾是否有空白/引号）打印出来，方便排查复制粘贴带入的隐藏字符。
# 只输出结构信息，永远不会打印凭据内容。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CLI
        run: npm install --prefix .tools --no-audit --no-fund @lazycatcloud/lzc-cli@2.0.9
      - name: Describe credentials and try login
        env:
          LAZYCAT_USERNAME: ${{ secrets.LAZYCAT_USERNAME }}
          LAZYCAT_PASSWORD: ${{ secrets.LAZYCAT_PASSWORD }}
        run: node scripts/lazycat-store.mjs check
