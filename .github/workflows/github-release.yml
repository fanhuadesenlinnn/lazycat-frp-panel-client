name: Mirror Seafile Pro images (private app only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seafile-pro-image-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned official CLI
        run: npm install --prefix .tools --no-audit --no-fund @lazycatcloud/lzc-cli@2.0.9
      - name: Authenticate using existing repository secrets
        env:
          LAZYCAT_USERNAME: ${{ secrets.LAZYCAT_USERNAME }}
          LAZYCAT_PASSWORD: ${{ secrets.LAZYCAT_PASSWORD }}
        run: node scripts/lazycat-store.mjs login
      - name: Copy exact production images to Lazycat registry only
        env:
          LZC_CLI_ROOT: ${{ github.workspace }}/.tools/node_modules/@lazycatcloud/lzc-cli
        run: node tools/seafile-pro/scripts/mirror-images.mjs --apply
      - name: Save completed references even if a later copy fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seafile-pro-images-${{ github.run_id }}
          path: tools/seafile-pro/images.lock.json
          retention-days: 30
