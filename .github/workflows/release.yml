name: Release

# 大版本发布流水线：推送 v* 标签即触发，构建 LPK 并发布到 GitHub Release。
# 手动触发时传入的 tag 必须已经推送过，构建与发布都以该 tag 为准。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的已存在标签，例如 v0.2.0'
        required: true
        type: string

permissions:
  contents: read

# 发布不做并发取消：中途打断可能留下半成品 Release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false
      - name: Test manager
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Check out pinned upstream
        uses: actions/checkout@v4
        with:
          repository: VaalaCat/frp-panel
          ref: 1a58b856d7de19de8669b7072872986d2fa1604a
          path: .upstream/frp-panel
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go124-frpp-${{ hashFiles('.upstream/frp-panel/go.sum') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packager
        run: npm install --global @lazycatcloud/lzc-cli@2.0.9
      - name: Compile and package
        run: bash scripts/ci-release.sh
      - name: Upload built files for publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Resolve and validate tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "标签必须形如 v1.2.3（可带 -rc1 之类的后缀），实际为: $tag" >&2
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "远端不存在标签 $tag，请先推送该标签" >&2
            exit 1
          fi
          version_file=$(sed -n 's/^version:[[:space:]]*//p' package.yml | head -n1 | tr -d '"'"'"' \r')
          if [[ "${tag#v}" != "$version_file" ]]; then
            echo "标签 $tag 与 package.yml 的 version ($version_file) 不一致" >&2
            echo "请先修改 package.yml 并提交，再打标签发布。" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version_file" >> "$GITHUB_OUTPUT"
      - name: Download built files
        uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist
      - name: Verify checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -c SHA256SUMS
          ls -l
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖附件。"
            gh release upload "$TAG" --clobber dist/*.lpk dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --verify-tag \
              --generate-notes \
              dist/*.lpk dist/*.tar.gz dist/SHA256SUMS
          fi
      - name: Summarize
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### 发布 $TAG"
            echo
            echo "- 附件：LPK、上游与客户端源码归档、SHA256SUMS"
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
