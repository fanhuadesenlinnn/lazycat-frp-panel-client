name: Publish to Lazycat

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '懒猫仓库转存的目标架构'
        type: choice
        options: [amd64, arm64]
        default: amd64
      changelog:
        description: '提交审核的更新说明'
        type: string
        default: '完善客户端管理界面，优化镜像体积。'

permissions:
  contents: read

concurrency:
  group: lazycat-store-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache: false
      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - uses: actions/checkout@v4
        with:
          repository: fanhuadesenlinnn/frp-panel
          ref: e0d41f11131d2b773bd5e62fb63f6ff4e5b4bd6a
          path: .upstream/frp-panel
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go124-frpp-${{ hashFiles('.upstream/frp-panel/go.sum') }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select version
        id: meta
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' package.yml | tr -d '\r')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY}:$version" >> "$GITHUB_OUTPUT"
      - name: Compile both architectures
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            out="$PWD/content/bin/linux-$arch"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out/lzc-frpp-client" .
            (cd .upstream/frp-panel && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -mod=readonly -trimpath -ldflags '-s -w -X github.com/VaalaCat/frp-panel/conf.gitCommit=e0d41f11131d2b773bd5e62fb63f6ff4e5b4bd6a -X github.com/VaalaCat/frp-panel/conf.gitVersion=reliability-e0d41f1' -o "$out/frp-panel-client" ./cmd/frppc)
          done
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build, check and push image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: bash scripts/build-image.sh --push --repo "ghcr.io/${GITHUB_REPOSITORY}" --tag "$VERSION"
      - name: Archive sources
        run: |
          git archive --format=tar.gz --output="$PWD/dist/lazycat-client-source.tar.gz" HEAD
          git -C .upstream/frp-panel archive --format=tar.gz --output="$PWD/dist/frp-panel-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.run_id }}
          path: dist/*

  submit:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: source-${{ github.run_id }}
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned CLI
        run: npm install --prefix .tools --no-audit --no-fund @lazycatcloud/lzc-cli@2.0.9
      - name: Log in without exposing credentials
        env:
          LAZYCAT_USERNAME: ${{ secrets.LAZYCAT_USERNAME }}
          LAZYCAT_PASSWORD: ${{ secrets.LAZYCAT_PASSWORD }}
        run: node scripts/lazycat-store.mjs login
      - name: Copy image, package and submit review
        env:
          PUBLIC_IMAGE: ${{ needs.build.outputs.image }}
          STORE_ARCH: ${{ inputs.arch }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        run: node scripts/lazycat-store.mjs publish
      - name: Upload package and submission result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazycat-store-${{ github.run_id }}
          path: dist/*
          if-no-files-found: warn
