name: Transfer Monitoring Platform images
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
      - run: npm install --prefix .tools --no-audit --no-fund @lazycatcloud/lzc-cli@2.0.9
      - name: Login using existing LazyCat Secrets
        env:
          LAZYCAT_USERNAME: ${{ secrets.LAZYCAT_USERNAME }}
          LAZYCAT_PASSWORD: ${{ secrets.LAZYCAT_PASSWORD }}
        run: node scripts/lazycat-store.mjs login
      - name: Mirror Monitoring Platform 1.7.2
        run: node scripts/monitor-platform-transfer.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-platform-images
          path: dist/monitor-platform-images.json
          if-no-files-found: warn
