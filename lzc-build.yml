# 构建配置（正式发布使用）。
#
# 这里刻意不配置 contentdir：本应用是 image-only 包——管理器、上游客户端与
# 启动脚本都在 lzc-manifest.yml 的 application.image 指向的镜像里
# （见 Dockerfile.lpk），LPK 只保存一条镜像引用，所以安装包只有几百 KB。
# 若在这里加回 contentdir，二进制会被重新打进 LPK。
#
# 也不配置 buildscript：本地镜像构建时用 scripts/build-binaries.sh 编译二进制。
manifest: ./lzc-manifest.yml
pkgout: ./dist
icon: ./icon.png
