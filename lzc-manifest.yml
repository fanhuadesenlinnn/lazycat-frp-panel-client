# The gateway remains in the app container; the backend and all FRP clients use
# the host network. Management HTTP travels over a private shared Unix Socket.
usage: |
  请在远端 Master 创建客户端节点，将启动命令粘贴到本应用。
  支持同时连接多个独立面板，每个连接分别管理配置、进程和日志。

  本版本的客户端使用 Host 网络：127.0.0.1 指懒猫微服宿主机，
  可以直接连接宿主机服务；局域网服务仍填写其可达地址。
  多个连接共享宿主机网络，各自使用的访客端口、Worker 端口与 WireGuard 接口应避免冲突。
  管理界面通过懒猫入口访问，后台管理接口使用私有 Unix Socket，不监听宿主机 TCP 端口。

application:
  image: registry.lazycat.cloud/u2982125700/fanhuadesenlinnn/lazycat-frp-panel-client:98852721e5dadda2
  subdomain: frpp
  background_task: true
  routes:
    - /=exec://18080,/app/start.sh
  environment:
    - LZCFRPP_ROLE=gateway

services:
  client:
    image: registry.lazycat.cloud/u2982125700/fanhuadesenlinnn/lazycat-frp-panel-client:98852721e5dadda2
    network_mode: host
    # Share the existing data directory with the app gateway, preserving upgrades.
    binds:
      - /lzcapp/var/frp-panel-client:/lzcapp/var/frp-panel-client
    environment:
      - LZCFRPP_ROLE=backend
      - LZCFRPP_REQUIRE_ADMIN=1
      - LZCFRPP_TRUST_INGRESS=1
    healthcheck:
      test: [CMD-SHELL, "test -S /lzcapp/var/frp-panel-client/manager.sock"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 3
