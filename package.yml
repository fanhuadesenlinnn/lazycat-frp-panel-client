package: cloud.lazycat.app.frp-panel-client
version: 0.3.0
name: frp-panel 客户端
description: 在内网设备上运行 frp-panel client，把本机与局域网服务通过自建 Master 暴露出去；提供中文管理界面，同时管理多个独立面板的连接、客户端进程与日志。
author: fanhuadesenlinnn
license: AGPL-3.0
homepage: https://github.com/fanhuadesenlinnn/lazycat-frp-panel-client
min_os_version: 1.5.0
locales:
  zh-CN:
    name: frp-panel 客户端
    usage: 请先自行部署远端 frp-panel Master 和 Server，在 Master 的客户端页面创建节点，再将启动命令粘贴到本应用。仅懒猫管理员可管理本应用。支持同时连接多个独立面板，连接配置持久保存；127.0.0.1 指应用容器，访问局域网服务请填写可达的局域网地址。
    description: 在内网设备上运行 frp-panel client，把本机与局域网服务通过自建 Master 暴露出去；提供中文管理界面，同时管理多个独立面板的连接、客户端进程与日志。
  en-US:
    name: frp-panel Client
    usage: Deploy your own remote frp-panel Master and Server first. Create a client in Master and paste its startup command into this app. Only Lazycat administrators can manage the app. Settings persist across restarts. The address 127.0.0.1 refers to the application container; use a reachable LAN address for LAN services.
    description: Run the frp-panel client on your LAN device and publish local services through your own master. Ships a Chinese web UI to control the client process and its connection settings.
permissions:
  required:
    # 需要访问自建的 frp-panel Master（通常位于公网）
    - net.internet
    # 需要访问局域网内的目标服务，才能把它们通过 frp 暴露出去
    - net.lan
